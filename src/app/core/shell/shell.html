<div class="shell-container">
  <!-- Desktop Sidebar -->
  <aside class="sidebar desktop-only glass-panel">
    <div class="logo">
      <h1 class="gradient-text">QuestLog</h1>
    </div>
    <nav class="nav-menu">
      <a routerLink="/dashboard" routerLinkActive="active" class="nav-item">
        <span class="icon">🏠</span> Dashboard
      </a>
      <a routerLink="/habits" routerLinkActive="active" class="nav-item">
        <span class="icon">✅</span> Habits
      </a>
      <a routerLink="/goals" routerLinkActive="active" class="nav-item">
        <span class="icon">🎯</span> Goals
      </a>
      <a routerLink="/log" routerLinkActive="active" class="nav-item">
        <span class="icon">📝</span> Daily Log
      </a>
    </nav>
  </aside>

  <!-- Main Content -->
  <main class="main-content">
    <router-outlet></router-outlet>
  </main>

  <!-- Mobile Bottom Nav -->
  <nav class="bottom-nav mobile-only glass-panel">
    <a routerLink="/dashboard" routerLinkActive="active" class="nav-item">
      <span class="icon">🏠</span>
      <span class="label">Home</span>
    </a>
    <a routerLink="/habits" routerLinkActive="active" class="nav-item">
      <span class="icon">✅</span>
      <span class="label">Habits</span>
    </a>
    <a routerLink="/goals" routerLinkActive="active" class="nav-item">
      <span class="icon">🎯</span>
      <span class="label">Goals</span>
    </a>
    <a routerLink="/log" routerLinkActive="active" class="nav-item">
      <span class="icon">📝</span>
      <span class="label">Log</span>
    </a>
  </nav>
  <!-- Global Toast Notifications -->
  <app-toast-container></app-toast-container>
</div>
