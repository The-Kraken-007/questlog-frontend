<div class="auth-page">
  <div class="auth-card glass-panel">
    <div class="auth-header">
      <h1 class="gradient-text">QuestLog</h1>
      @if (step() === 1) {
        <p class="auth-subtitle">Enter your email to get a reset token.</p>
      } @else {
        <p class="auth-subtitle">Paste the token from the server console below.</p>
      }
    </div>

    @if (step() === 1) {
      <!-- Step 1: request token -->
      <form class="auth-form" (ngSubmit)="requestToken()">
        <div class="form-group">
          <label for="email">Email</label>
          <input
            id="email"
            type="email"
            placeholder="you@example.com"
            [(ngModel)]="email"
            name="email"
            autocomplete="email"
            required
          />
        </div>

        <button type="submit" class="btn-primary" [disabled]="isLoading()">
          @if (isLoading()) {
            <span class="spinner"></span> Sending...
          } @else {
            Send reset token
          }
        </button>
      </form>
    } @else {
      <!-- Step 2: enter token + new password -->
      <form class="auth-form" (ngSubmit)="resetPassword()">
        <div class="form-group">
          <label for="token">Reset Token</label>
          <input
            id="token"
            type="text"
            placeholder="Paste token from server console"
            [(ngModel)]="token"
            name="token"
            required
          />
        </div>

        <div class="form-group">
          <label for="newPassword">New Password</label>
          <input
            id="newPassword"
            type="password"
            placeholder="At least 6 characters"
            [(ngModel)]="newPassword"
            name="newPassword"
            required
            minlength="6"
          />
        </div>

        <button type="submit" class="btn-primary" [disabled]="isLoading()">
          @if (isLoading()) {
            <span class="spinner"></span> Resetting...
          } @else {
            Reset password
          }
        </button>
      </form>
    }

    <p class="auth-switch">
      Remember your password? <a routerLink="/login">Sign in</a>
    </p>
  </div>
</div>
