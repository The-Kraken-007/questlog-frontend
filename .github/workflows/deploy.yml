name: Deploy — Frontend

on:
  push:
    branches:
      - develop

env:
  # TODO: Update these with your actual Azure Resource Group and Container App names
  RESOURCE_GROUP: quest-log
  CONTAINER_APP_NAME: quest-log-ui

jobs:
  build-and-deploy:
    name: Build, Test & Docker Build (Angular 22 / Node 22)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: '22'
          cache: 'npm'

      - name: Install dependencies
        run: npm ci

      - name: Build (production)
        run: npm run build

      - name: Run tests
        run: npm test

      - name: Build Docker image
        run: docker build -t questlog-frontend:${{ github.sha }} -t questlog-frontend:latest .

      # ─────────────────────────────────────────────────────────────────────────
      # Azure Container Apps Deployment
      # ─────────────────────────────────────────────────────────────────────────
      - name: Log in to Azure Container Registry
        uses: azure/docker-login@v2
        with:
          login-server: ${{ secrets.ACR_LOGIN_SERVER }}
          username: ${{ secrets.ACR_USERNAME }}
          password: ${{ secrets.ACR_PASSWORD }}

      - name: Push image to ACR
        run: |
          docker tag questlog-frontend:latest ${{ secrets.ACR_LOGIN_SERVER }}/questlog-frontend:latest
          docker tag questlog-frontend:${{ github.sha }} ${{ secrets.ACR_LOGIN_SERVER }}/questlog-frontend:${{ github.sha }}
          docker push ${{ secrets.ACR_LOGIN_SERVER }}/questlog-frontend:latest
          docker push ${{ secrets.ACR_LOGIN_SERVER }}/questlog-frontend:${{ github.sha }}

      - name: Azure Login
        uses: azure/login@v2
        with:
          creds: ${{ secrets.AZURE_CREDENTIALS }}

      - name: Deploy to Azure Container App
        uses: azure/cli@v2
        with:
          azcliversion: latest
          inlineScript: |
            az containerapp registry set \
              --name ${{ env.CONTAINER_APP_NAME }} \
              --resource-group ${{ env.RESOURCE_GROUP }} \
              --server ${{ secrets.ACR_LOGIN_SERVER }} \
              --username ${{ secrets.ACR_USERNAME }} \
              --password ${{ secrets.ACR_PASSWORD }}

            az containerapp update \
              --name ${{ env.CONTAINER_APP_NAME }} \
              --resource-group ${{ env.RESOURCE_GROUP }} \
              --image ${{ secrets.ACR_LOGIN_SERVER }}/questlog-frontend:${{ github.sha }}
