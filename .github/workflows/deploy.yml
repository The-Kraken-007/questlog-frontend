name: Deploy — Frontend

on:
  push:
    branches:
      - develop

jobs:
  build-and-deploy:
    name: Build, Test & Docker Build (Angular 22 / Node 22)
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node 22
        uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: "npm"

      - name: Install dependencies
        run: npm ci

      - name: Build (production)
        run: npm run build

      - name: Run tests
        run: npm test

      - name: Build Docker image
        run: docker build -t questlog-frontend:${{ github.sha }} -t questlog-frontend:latest .

